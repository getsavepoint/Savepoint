services:
  postgres:
    image: postgres:17-alpine
    container_name: savepoint-postgres
    environment:
      POSTGRES_USER: savepoint
      POSTGRES_PASSWORD: savepoint_dev_password
      POSTGRES_DB: savepoint_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: savepoint-redis
    ports:
      - "6379:6379"

  mailpit:
    image: axllent/mailpit:latest
    container_name: savepoint-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
